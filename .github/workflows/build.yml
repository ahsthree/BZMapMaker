name: Build Cross-Platform Executables

on:
  release:
    types: [published]
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: BZMapMaker-${{ github.ref_name }}-windows-x64.zip
            executable_name: bz_mapmaker.exe
          - os: macos-latest
            artifact_name: BZMapMaker-${{ github.ref_name }}-macOS-x64.zip
            executable_name: bz_mapmaker

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --name ${{ matrix.executable_name }} bzmapmaker.py

      - name: Package Windows Artifact
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path "dist\${{ matrix.executable_name }}" -DestinationPath "${{ matrix.artifact_name }}"

      - name: Package macOS Artifact
        if: runner.os == 'macOS'
        run: |
          zip -j "${{ matrix.artifact_name }}" "dist/${{ matrix.executable_name }}"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
