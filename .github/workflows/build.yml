name: Build Cross-Platform Executables

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: BZMapMaker-${{ github.ref_name }}-Windows-x64.zip
            executable_name: bz_mapmaker.exe
          - os: macos-latest
            artifact_name: BZMapMaker-${{ github.ref_name }}-macOS-x64.zip
            executable_name: bz_mapmaker

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyqt6 numpy

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name bz_mapmaker bzmapmaker.py
        shell: bash

      - name: Extract and Include Custom Objects
        run: |
          TARGET_DIR="dist/bz_mapmaker"
          
          # Dynamically find the objects zip file
          ZIP_FILE=$(ls bzmapmaker-objects-*.zip 2>/dev/null | head -n 1)
          
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting $ZIP_FILE into distribution folder..."
            mkdir -p "$TARGET_DIR"
            unzip -q "$ZIP_FILE" -d "$TARGET_DIR/"
          else
            echo "Warning: bzmapmaker-objects zip file not found in root."
          fi
        shell: bash

      - name: Package Release Bundle (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Compress-Archive -Path "dist/bz_mapmaker/*" -DestinationPath "${{ matrix.artifact_name }}"
        shell: pwsh

      - name: Package Release Bundle (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          zip -r "../${{ matrix.artifact_name }}" bz_mapmaker/
          cd ..
        shell: bash

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bzmapmaker-${{ matrix.os }}
          path: ${{ matrix.artifact_name }}

  release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Publish Release with Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            all-artifacts/bzmapmaker-*/*.zip
          body: |
            Release of BZMapMaker version ${{ github.ref_name }}.
            Includes Windows and macOS executable packages.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
