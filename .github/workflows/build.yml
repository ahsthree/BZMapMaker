name: Build Cross-Platform Executables

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: BZMapMaker-Windows-x64.zip
            executable_name: bz_mapmaker.exe
          - os: macos-latest
            artifact_name: BZMapMaker-macOS-x64.zip
            executable_name: bz_mapmaker

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed bz_mapmaker.spec
        shell: bash

      - name: Extract and Include Custom Objects
        run: |
          TARGET_DIR="dist/bz_mapmaker"
          
          # Dynamically find the objects zip file
          ZIP_FILE=$(ls bzmapmaker-objects-*.zip 2>/dev/null | head -n 1)
          
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting $ZIP_FILE into distribution folder..."
            mkdir -p "$TARGET_DIR"
            unzip -q "$ZIP_FILE" -d "$TARGET_DIR/"
          else
            echo "Warning: bzmapmaker-objects zip file not found in root."
          fi
        shell: bash

      - name: Package Release Bundle (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Compress-Archive -Path "dist/bz_mapmaker/*" -DestinationPath "${{ matrix.artifact_name }}"
        shell: pwsh

      - name: Package Release Bundle (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          zip -r "../${{ matrix.artifact_name }}" bz_mapmaker/
          cd ..
        shell: bash

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bzmapmaker-${{ matrix.os }}
          path: ${{ matrix.artifact_name }}
